[project]
name = "coletor"
version = "0.1.0"
description = "Robô de coleta diária de dados com Playwright, PostgreSQL, histórico de execuções e alertas no Discord."
readme = "README.md"
license = "MIT"
authors = [{ name = "Mateus", email = "mateusknc@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "playwright==1.56.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.15.0",
    "selectolax>=1.0.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
coletor = "coletor.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["coletor"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=coletor --cov-report=term-missing"
markers = ["banco: testes que precisam de PostgreSQL (DATABASE_URL_TESTE)"]
