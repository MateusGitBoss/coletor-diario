services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coletor
    ports: ["5432:5432"]
    volumes: [dados:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  coletor:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@banco:5432/coletor
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    depends_on:
      banco: { condition: service_healthy }
    profiles: [coleta]  # roda sob demanda: docker compose run --rm coletor

volumes:
  dados:
